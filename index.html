    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Wages to Wealth ASIC compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Wages to Wealth provides general financial information and education only. It does not hold an Australian Financial Services Licence and does not provide personal financial advice. All content is general advice compliant under the Corporations Act 2001."
          }
        },
        {
          "@type": "Question",
          "name": "How many learning modules does Wages to Wealth include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Wages to Wealth includes 18 modules: 10 covering general finance (budgeting, banking, debt, property, investing, superannuation) and 8 workplace-specific modules covering pay slips, salary packaging, novated leasing, super contributions, income tax, workplace entitlements, employee share schemes, and life events."
          }
        },
        {
          "@type": "Question",
          "name": "Can employees see each other's financial data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Employee financial data is fully private. Employers can only see anonymous aggregate statistics — never individual scores, quiz results, or calculator inputs. Row-level security enforces this at the database level."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Financial Literacy Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Financial Literacy Score is a 0–100 score calculated from an employee's quiz results across completed modules. It updates in real time and is displayed only to the employee. Tiers range from Beginner through to Expert."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Employers can start a 30-day free trial with no credit card required. The Starter plan covers up to 50 employees at $299/month."
          }
        }
      ]
    }
    </script>
